<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Player - Classroom-x-zone</title>
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="../../assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <style>
        :root {
            --accent-color: #ff6600;
            --accent-glow: 0 0 12px rgba(255, 102, 0, 0.6);
            --bg-dark: #08080c;
            --window-bg: #1e1e24;
            --btn-bg: #0c0c12;
            --text-color: #ffffff;
            --text-muted: #888899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Ambient Ember / Particle Canvas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 85%, #2a1100 0%, #0d0602 45%, #050406 100%);
        }

        /* Game Main Stage Wrapper */
        .stage-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 78vw;
            max-width: 1200px;
            height: 82vh;
            position: relative;
        }

        /* Game Window - matches Image 1 */
        .game-window {
            position: relative;
            width: 100%;
            flex: 1;
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.35);
            display: flex;
            flex-direction: column;
            background-color: #1b1b22;
            overflow: hidden;
        }

        /* Corner Close Buttons */
        .corner-close {
            position: absolute;
            top: 10px;
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ddd;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 25;
            transition: all 0.2s;
            font-size: 15px;
            line-height: 1;
        }
        .corner-close:hover {
            border-color: var(--accent-color);
            color: #fff;
            background: var(--accent-color);
            box-shadow: var(--accent-glow);
        }
        .close-tl { left: 10px; }
        .close-tr { right: 10px; }

        /* Unity-style loading screen container inside game frame */
        #unity-loader {
            position: absolute;
            inset: 0;
            background: #1e1e24;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 15;
            transition: opacity 0.4s ease;
        }
        #unity-loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .unity-logo {
            width: 110px;
            height: 110px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
            animation: pulse-logo 2.5s ease-in-out infinite;
        }

        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        .unity-progress-track {
            width: 180px;
            height: 12px;
            background: #0d0d12;
            border: 1px solid #444455;
            border-radius: 2px;
            padding: 2px;
            position: relative;
            overflow: hidden;
        }

        .unity-progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.12s linear;
        }

        /* Iframe */
        .iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }

        /* Controls Toolbar under the window */
        .controls-toolbar {
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--accent-color);
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            gap: 12px;
        }

        .tool-group-left, .tool-group-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn {
            background: var(--btn-bg);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            width: 28px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s, color 0.15s;
            font-size: 13px;
            text-decoration: none;
        }

        .tool-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: var(--accent-glow);
        }

        /* Volume Box */
        .volume-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--btn-bg);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            padding: 3px 8px;
            height: 26px;
        }

        .volume-slider {
            width: 65px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .volume-pct {
            font-size: 9px;
            min-width: 32px;
            text-align: right;
            color: var(--accent-color);
        }

        .game-title-center {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            text-shadow: var(--accent-glow);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        /* Bottom Floating Dock Navigation Bar */
        .bottom-dock {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(14, 14, 20, 0.95);
            border: 1.5px solid var(--accent-color);
            border-radius: 30px;
            padding: 6px 16px;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
            z-index: 100;
        }

        .dock-item {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            border: none;
            font-size: 16px;
        }

        .dock-item:hover {
            color: #fff;
            background: rgba(255, 102, 0, 0.2);
        }

        .dock-item.active {
            background: var(--accent-color);
            color: #000;
            box-shadow: var(--accent-glow);
            font-weight: bold;
        }

        /* Stacked Toast Notifications on Bottom Right */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            z-index: 120;
            pointer-events: none;
        }

        .toast-bubble {
            background: #0e0e14;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 9px 14px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8), var(--accent-glow);
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        .toast-bubble.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* Console Modal Drawer */
        #console-drawer {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 360px;
            height: 180px;
            background: #09090f;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 10px;
            display: none;
            flex-direction: column;
            z-index: 110;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            font-family: monospace;
            font-size: 12px;
        }
        #console-drawer.open {
            display: flex;
        }
        #console-output {
            flex: 1;
            overflow-y: auto;
            color: #00ff66;
            margin-bottom: 6px;
            white-space: pre-wrap;
        }

        @media (max-width: 900px) {
            .stage-wrapper {
                width: 96vw;
                height: 80vh;
            }
            .volume-box {
                display: none;
            }
            .game-title-center {
                font-size: 9px;
                max-width: 150px;
            }
            .bottom-dock {
                gap: 5px;
                padding: 4px 10px;
            }
            .dock-item {
                width: 28px;
                height: 28px;
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #particles-canvas { display: none; }
            .unity-logo { animation: none; }
        }
    </style>
</head>

    <!-- Console Drawer -->

        <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--accent-color);">
            <span>Console Log</span>
            <span style="cursor:pointer;" onclick="toggleConsole()">✕</span>

        <div id="console-output">[System] Game Player Ready...</div>
    </div>

    <!-- Stacked Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        const PRE = 'cxz_';
        
        // Sync accent color with localStorage
        const savedColor = localStorage.getItem(PRE + 'accent') || '#ff6600';
        document.documentElement.style.setProperty('--accent-color', savedColor);
        document.documentElement.style.setProperty('--accent-glow', `0 0 14px ${savedColor}`);

        // Parse query params
        const params = new URLSearchParams(window.location.search);
        let gameUrl = params.get('url') || 'gd.html';
        const gameTitle = params.get('title') || 'A Dance of Fire and Ice';

        const titleEl = document.getElementById('game-title-text');
        const iframe = document.getElementById('game-iframe');
        const unityLoader = document.getElementById('unity-loader');
        const unityFill = document.getElementById('unity-fill');

        titleEl.textContent = gameTitle;
        document.title = `${gameTitle} - Classroom X Zone`;

        // Check Panic Key setup
        const panicEnabled = localStorage.getItem(PRE + 'panic-enable') === 'true';
        const panicKey = localStorage.getItem(PRE + 'panic-key');
        const panicUrl = localStorage.getItem(PRE + 'panic-url') || 'https://www.google.com';

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.fullscreenElement) {
                goHome();
            }
            if (panicEnabled && panicKey && e.key === panicKey) {
                window.location.href = panicUrl;
            }
        });

        // Stretched Resolution setting check
        if (localStorage.getItem(PRE + 'stretched') === 'on') {
            document.getElementById('game-window').style.width = '100vw';
            document.getElementById('game-window').style.height = 'calc(100vh - 50px)';
        }

        // Fake Unity Progress simulation before revealing iframe
        let progress = 0;
        const progressTimer = setInterval(() => {
            progress += Math.floor(Math.random() * 18) + 8;
            if (progress > 100) progress = 100;
            unityFill.style.width = progress + '%';

            if (progress >= 100) {
                clearInterval(progressTimer);
                setTimeout(() => {
                    unityLoader.classList.add('fade-out');
                    // Actually set iframe source
                    iframe.src = gameUrl;
                    logConsole(`[Loaded] ${gameTitle} loaded successfully.`);
                    pushToast(`${gameTitle} loaded`);
                    setTimeout(() => pushToast(`${gameTitle} loaded`), 400); // Image 1 shows duplicate loaded badge
                }, 300);
            }
        }, 80);

        // Toast Notification System
        function pushToast(msg) {
            const container = document.getElementById('toast-container');
            const bubble = document.createElement('div');
            bubble.className = 'toast-bubble';
            bubble.textContent = msg;
            container.appendChild(bubble);

            requestAnimationFrame(() => {
                bubble.classList.add('show');
            });

            setTimeout(() => {
                bubble.classList.remove('show');
                setTimeout(() => bubble.remove(), 400);
            }, 3500);
        }

        // Toolbar Actions
        function goHome() {
            window.location.href = '../../../index.html';
        }

        function reloadGame() {
            unityLoader.classList.remove('fade-out');
            unityFill.style.width = '0%';
            iframe.src = 'about:blank';
            progress = 0;
            const reTimer = setInterval(() => {
                progress += 25;
                unityFill.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(reTimer);
                    setTimeout(() => {
                        unityLoader.classList.add('fade-out');
                        iframe.src = gameUrl;
                        pushToast(`${gameTitle} reloaded`);
                    }, 200);
                }
            }, 60);
        }

        function openNewTab() {
            window.open(gameUrl, '_blank');
        }

        function openAboutBlank() {
            const win = window.open('about:blank', '_blank');
            if (!win) return alert("Pop-ups are blocked. Please allow pop-ups for this site.");
            const doc = win.document;
            const ifr = doc.createElement('iframe');
            ifr.style.width = '100vw';
            ifr.style.height = '100vh';
            ifr.style.border = 'none';
            ifr.style.margin = '0';
            ifr.style.padding = '0';
            ifr.src = window.location.href;
            doc.body.style.margin = '0';
            doc.body.appendChild(ifr);
        }

        function toggleFullscreen() {
            const gw = document.getElementById('game-window');
            if (!document.fullscreenElement) {
                if (gw.requestFullscreen) gw.requestFullscreen();
                else if (gw.webkitRequestFullscreen) gw.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function downloadGame() {
            fetch(gameUrl).then(r => r.blob()).then(blob => {
                const u = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = u;
                a.download = gameUrl.split('/').pop() || 'game.html';
                a.click();
                URL.revokeObjectURL(u);
            }).catch(() => alert('Could not fetch file for download'));
        }

        function toggleConsole() {
            const c = document.getElementById('console-drawer');
            c.classList.toggle('open');
        }

        function logConsole(msg) {
            const o = document.getElementById('console-output');
            o.textContent += '\n' + msg;
            o.scrollTop = o.scrollHeight;
        }

        // Volume controls
        const volSlider = document.getElementById('vol-slider');
        const volText = document.getElementById('vol-text');
        volSlider.addEventListener('input', (e) => {
            volText.textContent = e.target.value + '%';
        });

        let isMuted = false;
        function toggleMute() {
            isMuted = !isMuted;
            if (isMuted) {
                volSlider.value = 0;
                volText.textContent = '0%';
            } else {
                volSlider.value = 100;
                volText.textContent = '100%';
            }
        }

        // Ambient Floating Ember / Firefly particles (Optimized for low-end devices)
        (function initEmbers() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const count = 35; // Lightweight count for slow devices

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 2.5 + 1.2,
                    speedY: Math.random() * 0.4 + 0.15,
                    speedX: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.7 + 0.3,
                    fade: (Math.random() * 0.01 + 0.005) * (Math.random() > 0.5 ? 1 : -1)
                });
            }

            let lastFrame = 0;
            function render(now) {
                requestAnimationFrame(render);
                if (now - lastFrame < 45) return; // Cap at ~22fps for extreme battery / CPU saving
                lastFrame = now;

                ctx.clearRect(0, 0, w, h);

                for (let i = 0; i < count; i++) {
                    const p = particles[i];
                    p.y -= p.speedY;
                    p.x += p.speedX;
                    p.alpha += p.fade;

                    if (p.alpha <= 0.2 || p.alpha >= 0.9) p.fade = -p.fade;
                    if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
                    if (p.x < -10) p.x = w + 10;
                    if (p.x > w + 10) p.x = -10;

                    ctx.fillStyle = `rgba(255, 120, 20, ${p.alpha})`;
                    ctx.shadowBlur = p.r * 3;
                    ctx.shadowColor = 'rgba(255, 110, 0, 0.8)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(render);
        })();
    </script>
</body>
</html>
