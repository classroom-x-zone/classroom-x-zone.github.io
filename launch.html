<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom-X-Zone Launcher</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08080c;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #08080c;
        }

        h1 {
            margin: 0 0 25px;

            color: #ff6600;

            font-size: 26px;
            letter-spacing: 2px;

            text-shadow:
                0 0 10px rgba(255, 102, 0, 0.6);
        }

        .loader {
            width: 280px;
            height: 14px;

            padding: 2px;

            border: 2px solid #ff6600;
            border-radius: 4px;

            background: #0e0e16;

            box-shadow:
                0 0 10px rgba(255, 102, 0, 0.5);
        }

        #bar {
            width: 0%;
            height: 100%;

            background: #ff6600;

            transition: width 0.15s ease;
        }

        #status {
            margin-top: 14px;

            color: #888899;

            font-size: 12px;
        }
    </style>
</head>

<body>

    <div id="loading">
        <h1>CLASSROOM-X-ZONE</h1>

        <div class="loader">
            <div id="bar"></div>
        </div>

        <div id="status">
            OPENING PORTAL...
        </div>
    </div>


    <script>
        (() => {

            /*
             * ========================================================
             * THIS IS THE ONLY SOURCE.
             *
             * The launcher fetches the current index.html directly
             * from GitHub every time it is opened.
             * ========================================================
             */

            const INDEX_URL =
                "https://raw.githubusercontent.com/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd/refs/heads/main/index.html";


            const bar =
                document.getElementById("bar");

            const status =
                document.getElementById("status");


            function progress(value) {
                bar.style.width = value + "%";
            }


            function setStatus(text) {
                status.textContent = text;
            }


            /*
             * ========================================================
             * OPEN ABOUT:BLANK FIRST
             * ========================================================
             */

            const newTab =
                window.open(
                    "about:blank",
                    "_blank"
                );


            if (!newTab) {

                setStatus(
                    "POPUP BLOCKED - ALLOW POPUPS AND TRY AGAIN"
                );

                return;
            }


            /*
             * ========================================================
             * FETCH CURRENT INDEX.HTML
             * ========================================================
             */

            async function load() {

                try {

                    setStatus(
                        "FETCHING LATEST INDEX.HTML..."
                    );

                    progress(10);


                    const response =
                        await fetch(
                            INDEX_URL,
                            {
                                cache: "no-store"
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "HTTP " +
                            response.status
                        );

                    }


                    progress(40);


                    setStatus(
                        "READING SITE CODE..."
                    );


                    /*
                     * THIS IS THE ACTUAL CODE FROM
                     * YOUR GITHUB INDEX.HTML.
                     */

                    let siteCode =
                        await response.text();


                    progress(65);


                    /*
                     * =================================================
                     * IMPORTANT:
                     *
                     * Because the code is being moved from
                     * raw.githubusercontent.com into about:blank,
                     * relative URLs need to point back to the
                     * GitHub repository.
                     *
                     * Example:
                     *
                     * ./g/assets/Geometry-Dash.png
                     *
                     * becomes relative to this directory:
                     *
                     * https://raw.githubusercontent.com/.../main/
                     * =================================================
                     */

                    const baseURL =
                        INDEX_URL.substring(
                            0,
                            INDEX_URL.lastIndexOf("/") + 1
                        );


                    /*
                     * Remove an existing base tag if the source
                     * ever gets one.
                     */

                    siteCode =
                        siteCode.replace(
                            /<base[^>]*>/gi,
                            ""
                        );


                    /*
                     * Insert the correct base URL.
                     */

                    const baseTag =
                        `<base href="${baseURL}">`;


                    if (
                        /<head[^>]*>/i.test(siteCode)
                    ) {

                        siteCode =
                            siteCode.replace(
                                /<head([^>]*)>/i,
                                `<head$1>
${baseTag}`
                            );

                    } else {

                        siteCode =
                            baseTag +
                            siteCode;

                    }


                    progress(80);


                    setStatus(
                        "OPENING CLASSROOM-X-ZONE..."
                    );


                    /*
                     * =================================================
                     * WRITE THE FETCHED CODE DIRECTLY INTO
                     * THE ABOUT:BLANK TAB.
                     * =================================================
                     */

                    newTab.document.open();

                    newTab.document.write(
                        siteCode
                    );

                    newTab.document.close();


                    progress(100);


                    setStatus(
                        "DONE"
                    );


                    /*
                     * Close the launcher page.
                     */

                    setTimeout(() => {
                        window.close();
                    }, 300);


                } catch (error) {

                    console.error(
                        "Launcher error:",
                        error
                    );


                    setStatus(
                        "FAILED TO LOAD"
                    );


                    /*
                     * Show the actual error inside
                     * the about:blank tab.
                     */

                    newTab.document.open();

                    newTab.document.write(`
                        <!DOCTYPE html>

                        <html lang="en">

                        <head>

                            <meta charset="UTF-8">

                            <title>
                                Classroom-X-Zone
                            </title>

                            <style>

                                html,
                                body {
                                    margin: 0;
                                    width: 100%;
                                    height: 100%;

                                    background: #08080c;
                                    color: white;

                                    font-family: Arial,
                                        sans-serif;
                                }

                                body {
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;

                                    text-align: center;
                                }

                                .error {
                                    max-width: 600px;
                                    padding: 30px;
                                }

                                h1 {
                                    color: #ff6600;
                                }

                                p {
                                    color: #888899;
                                }

                                pre {
                                    padding: 15px;

                                    border: 1px solid #333;
                                    border-radius: 6px;

                                    background: #0e0e16;

                                    color: #ff6666;

                                    text-align: left;

                                    white-space: pre-wrap;
                                    word-break: break-word;
                                }

                            </style>

                        </head>

                        <body>

                            <div class="error">

                                <h1>
                                    CLASSROOM-X-ZONE
                                </h1>

                                <p>
                                    Failed to fetch index.html
                                </p>

                                <pre>${String(error.message)}</pre>

                            </div>

                        </body>

                        </html>
                    `);

                    newTab.document.close();

                }

            }


            /*
             * START
             */

            load();

        })();
    </script>

</body>
</html>
