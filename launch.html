<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loading...</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #hk {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 999999;

            background: transparent;

            cursor: default;
        }

        #hk:hover {
            background: rgba(0, 0, 0, 0.01);
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            z-index: 1000000;

            transition:
                opacity 0.2s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-box {
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;

            margin: 0 auto 14px;

            border: 3px solid rgba(255,255,255,.15);
            border-top-color: #fff;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #status {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="loading-box">

            <div class="spinner"></div>

            <div id="status">
                Loading...
            </div>

        </div>
    </div>

    <div id="hk"></div>

    <script>
    (() => {

        /*
         * =====================================================
         * CONFIGURATION
         * =====================================================
         */

        const SITE_URL =
            "https://raw.githubusercontent.com/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd/refs/heads/main/index.html";


        /*
         * =====================================================
         * ELEMENTS
         * =====================================================
         */

        const hk =
            document.getElementById("hk");

        const loading =
            document.getElementById("loading");

        const status =
            document.getElementById("status");


        /*
         * =====================================================
         * KEEP THE LAUNCHER FOCUSED
         * =====================================================
         */

        hk.addEventListener(
            "mousedown",
            event => {

                event.preventDefault();

                window.focus();

            }
        );


        /*
         * =====================================================
         * CREATE ABOUT:BLANK TAB
         * =====================================================
         */

        function openSiteInBlankTab(html) {

            const newWindow =
                window.open(
                    "about:blank",
                    "_blank"
                );


            /*
             * Popup blocked
             */

            if (!newWindow) {

                status.textContent =
                    "Please allow pop-ups and try again.";

                loading.classList.remove(
                    "hidden"
                );

                return false;
            }


            /*
             * Give the new tab a real document.
             */

            const doc =
                newWindow.document;


            doc.open();


            /*
             * Write the fetched index.html
             * directly into about:blank.
             *
             * The site is therefore NOT opened
             * at the raw GitHub URL.
             */

            doc.write(html);


            doc.close();


            /*
             * The launcher tab can now disappear.
             */

            return true;
        }


        /*
         * =====================================================
         * FETCH SITE
         * =====================================================
         */

        async function launch() {

            try {

                status.textContent =
                    "Fetching site...";


                const response =
                    await fetch(
                        SITE_URL,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                status.textContent =
                    "Starting site...";


                const html =
                    await response.text();


                if (
                    !html ||
                    !html.trim()
                ) {

                    throw new Error(
                        "The site returned empty HTML."
                    );
                }


                /*
                 * Open the fetched HTML inside
                 * a new about:blank tab.
                 */

                const opened =
                    openSiteInBlankTab(
                        html
                    );


                if (opened) {

                    status.textContent =
                        "Launching...";


                    /*
                     * Leave the launcher tab
                     * blank after successfully
                     * opening the site.
                     */

                    setTimeout(() => {

                        document.open();

                        document.write(`
                            <!DOCTYPE html>
                            <html>
                            <head>
                                <meta charset="UTF-8">
                                <title>Loading...</title>
                            </head>
                            <body></body>
                            </html>
                        `);

                        document.close();

                    }, 100);
                }

            } catch (error) {

                console.error(
                    "Launcher error:",
                    error
                );


                status.textContent =
                    "Failed to load. Retrying...";


                /*
                 * Retry after a short delay.
                 */

                setTimeout(
                    launch,
                    1500
                );
            }
        }


        /*
         * =====================================================
         * START
         * =====================================================
         */

        launch();

    })();
    </script>

</body>
</html>
