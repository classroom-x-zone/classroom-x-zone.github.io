<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom-X-Zone</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #080808;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .logo span {
            color: #ff6600;
        }

        .loader {
            width: 220px;
            height: 5px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar {
            width: 0%;
            height: 100%;
            background: #ff6600;
            box-shadow: 0 0 12px #ff6600;
            animation: load 1.5s ease forwards;
        }

        @keyframes load {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        .status {
            margin-top: 15px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="logo">
            CLASSROOM<span>-X</span>-ZONE
        </div>

        <div class="loader">
            <div class="bar"></div>
        </div>

        <div class="status" id="status">
            Opening portal...
        </div>
    </div>

    <script>
        const MAIN_URL =
            "https://cdn.jsdelivr.net/gh/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd@main/index.html";

        const status =
            document.getElementById("status");

        function setStatus(text) {
            status.textContent = text;
        }

        /*
         * Open the blank tab IMMEDIATELY.
         * This prevents popup blockers from stopping it
         * while the site is being fetched.
         */
        const portal =
            window.open("about:blank", "_blank");

        if (!portal) {
            setStatus(
                "Popup blocked. Allow popups and try again."
            );
        } else {
            loadPortal();
        }

        async function loadPortal() {
            try {
                setStatus(
                    "Downloading portal..."
                );

                const response =
                    await fetch(MAIN_URL, {
                        cache: "no-store"
                    });

                if (!response.ok) {
                    throw new Error(
                        "HTTP " + response.status
                    );
                }

                let html =
                    await response.text();

                setStatus(
                    "Preparing portal..."
                );

                /*
                 * Directory containing index.html.
                 */
                const BASE_URL =
                    MAIN_URL.substring(
                        0,
                        MAIN_URL.lastIndexOf("/") + 1
                    );

                /*
                 * Make relative URLs work.
                 *
                 * Example:
                 *
                 * ./images/logo.png
                 *
                 * becomes:
                 *
                 * https://cdn.jsdelivr.net/.../images/logo.png
                 */
                html = html.replace(
                    /<head([^>]*)>/i,
                    `<head$1>
                        <base href="${BASE_URL}">
                    `
                );

                /*
                 * Tell the site that it was launched
                 * through the Classroom-X-Zone launcher.
                 */
                const launcherInfo = `
<script>
    window.__CXZ_LAUNCHED__ = true;

    window.__CXZ_SOURCE_URL__ =
        ${JSON.stringify(MAIN_URL)};
<\/script>
`;

                html = html.replace(
                    /<\/head>/i,
                    launcherInfo + "</head>"
                );

                /*
                 * Write the site into about:blank.
                 */
                portal.document.open();

                portal.document.write(
                    html
                );

                portal.document.close();

                setStatus(
                    "Portal loaded!"
                );

                /*
                 * Close the launcher page.
                 */
                setTimeout(() => {
                    window.close();
                }, 300);

            } catch (error) {

                console.error(
                    "Launcher error:",
                    error
                );

                setStatus(
                    "Failed to load portal."
                );

                /*
                 * Show the error inside the
                 * about:blank tab.
                 */
                try {
                    portal.document.open();

                    portal.document.write(`
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Classroom-X-Zone</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #080808;
            color: white;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            max-width: 500px;
        }

        h1 {
            color: #ff6600;
        }

        p {
            color: #888;
        }

        button {
            padding: 10px 20px;

            border: none;
            border-radius: 6px;

            background: #ff6600;
            color: #000;

            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>
            Classroom-X-Zone
        </h1>

        <p>
            The portal could not be loaded.
        </p>

        <p>
            ${error.message}
        </p>

        <button
            onclick="location.reload()"
        >
            Retry
        </button>

    </div>

</body>

</html>
                    `);

                    portal.document.close();

                } catch (writeError) {
                    console.error(
                        writeError
                    );
                }
            }
        }
    </script>

</body>
</html>
