<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classroom-X-Zone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #080808;

            z-index: 99999;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .logo span {
            color: #ff6600;
        }

        .loader {
            width: 220px;
            height: 5px;

            overflow: hidden;

            border-radius: 10px;

            background: #222;
        }

        .loader-bar {
            width: 0;
            height: 100%;

            background: #ff6600;

            box-shadow:
                0 0 12px #ff6600;

            animation:
                cxz-loading 1.5s ease forwards;
        }

        @keyframes cxz-loading {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        .status {
            margin-top: 15px;

            color: #888;

            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="loading">

        <div class="logo">
            CLASSROOM<span>-X</span>-ZONE
        </div>

        <div class="loader">
            <div class="loader-bar"></div>
        </div>

        <div class="status" id="status">
            Opening portal...
        </div>

    </div>


    <script>
        (() => {

            /* =========================================================
               MAIN SITE
            ========================================================= */

            const MAIN_URL =
                "https://cdn.jsdelivr.net/gh/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd@main/index.html";


            const status =
                document.getElementById("status");


            function setStatus(message) {
                status.textContent = message;
            }


            /* =========================================================
               OPEN ABOUT:BLANK IMMEDIATELY
            ========================================================= */

            const portal =
                window.open(
                    "about:blank",
                    "_blank"
                );


            if (!portal) {

                setStatus(
                    "Popup blocked. Allow popups and try again."
                );

                return;
            }


            /* =========================================================
               LOAD MAIN SITE
            ========================================================= */

            async function loadPortal() {

                try {

                    setStatus(
                        "Downloading portal..."
                    );


                    const response =
                        await fetch(
                            MAIN_URL,
                            {
                                cache: "no-store"
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "HTTP " +
                            response.status
                        );

                    }


                    let html =
                        await response.text();


                    setStatus(
                        "Preparing portal..."
                    );


                    /* =================================================
                       BASE URL
                    ================================================= */

                    const BASE_URL =
                        MAIN_URL.substring(
                            0,
                            MAIN_URL.lastIndexOf("/") + 1
                        );


                    /*
                     * Remove any existing base tags.
                     */

                    html =
                        html.replace(
                            /<base[^>]*>/gi,
                            ""
                        );


                    /*
                     * Add our base URL.
                     */

                    const baseTag = `
<base href="${BASE_URL}">
`;


                    if (
                        /<head[^>]*>/i.test(html)
                    ) {

                        html =
                            html.replace(
                                /<head([^>]*)>/i,
                                `<head$1>
${baseTag}`
                            );

                    } else {

                        html =
                            baseTag +
                            html;

                    }


                    /* =================================================
                       LAUNCHER INFORMATION
                    ================================================= */

                    const launcherInfo = `
<script>
window.__CXZ_LAUNCHED__ = true;

window.__CXZ_SOURCE_URL__ =
    ${JSON.stringify(MAIN_URL)};

window.__CXZ_GAME_BASE__ =
    ${JSON.stringify(BASE_URL)};
<\/script>
`;


                    html =
                        html.replace(
                            /<\/head>/i,
                            launcherInfo +
                            "</head>"
                        );


                    /* =================================================
                       PLAYER NAVIGATION BRIDGE
                    ================================================= */

                    const playerBridge = `
<script>
(function () {

    /*
     * This bridge works with the integrated CXZPlayer
     * that is already inside the current index.html.
     */

    function handlePlayerLink(event) {

        const link =
            event.target.closest(
                'a[href*="player.html"]'
            );

        if (!link) {
            return;
        }


        /*
         * STOP the browser from navigating to
         * player.html.
         */

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();


        try {

            const href =
                link.getAttribute("href");


            const url =
                new URL(
                    href,
                    document.baseURI
                );


            /*
             * Extract the actual game URL.
             */

            const gameURL =
                url.searchParams.get("url");


            /*
             * Extract game title.
             */

            const title =
                url.searchParams.get("title") ||
                link.dataset.title ||
                link.querySelector("h3")?.textContent?.trim() ||
                link.querySelector(".game-title")?.textContent?.trim() ||
                "Game";


            if (!gameURL) {

                console.error(
                    "[CXZ] No game URL found:",
                    url.href
                );

                return;
            }


            /*
             * Use the integrated player.
             */

            if (
                typeof window.CXZPlayer ===
                "object" &&
                typeof window.CXZPlayer.open ===
                "function"
            ) {

                window.CXZPlayer.open(
                    gameURL,
                    title
                );

                return;
            }


            /*
             * If the integrated player has not
             * initialized yet, wait for it.
             */

            let attempts = 0;


            const waitForPlayer =
                setInterval(() => {

                    attempts++;


                    if (
                        typeof window.CXZPlayer ===
                        "object" &&
                        typeof window.CXZPlayer.open ===
                        "function"
                    ) {

                        clearInterval(
                            waitForPlayer
                        );


                        window.CXZPlayer.open(
                            gameURL,
                            title
                        );

                    }


                    if (attempts >= 50) {

                        clearInterval(
                            waitForPlayer
                        );

                        console.error(
                            "[CXZ] Integrated player failed to initialize."
                        );

                    }

                }, 100);

        } catch (error) {

            console.error(
                "[CXZ] Player navigation error:",
                error
            );

        }

    }


    /*
     * CAPTURE PHASE
     *
     * This runs before the normal site
     * click handlers and before target="_blank"
     * can navigate to player.html.
     */

    document.addEventListener(
        "click",
        handlePlayerLink,
        true
    );


    /*
     * Also protect auxiliary mouse events.
     */

    document.addEventListener(
        "auxclick",
        function (event) {

            if (event.button !== 1) {
                return;
            }


            const link =
                event.target.closest(
                    'a[href*="player.html"]'
                );


            if (!link) {
                return;
            }


            event.preventDefault();
            event.stopPropagation();

        },
        true
    );


    console.log(
        "[CXZ] Integrated player navigation bridge loaded."
    );

})();
<\/script>
`;


                    /*
                     * Insert the bridge BEFORE the
                     * closing body tag.
                     */

                    html =
                        html.replace(
                            /<\/body>/i,
                            playerBridge +
                            "</body>"
                        );


                    /* =================================================
                       WRITE SITE INTO ABOUT:BLANK
                    ================================================= */

                    portal.document.open();


                    portal.document.write(
                        html
                    );


                    portal.document.close();


                    setStatus(
                        "Portal loaded!"
                    );


                    /* =================================================
                       CLOSE ORIGINAL LAUNCHER
                    ================================================= */

                    setTimeout(() => {

                        window.close();

                    }, 500);


                } catch (error) {

                    console.error(
                        "[CXZ Launcher]",
                        error
                    );


                    setStatus(
                        "Failed to load portal."
                    );


                    /* =================================================
                       ERROR PAGE
                    ================================================= */

                    try {

                        portal.document.open();


                        portal.document.write(`
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Classroom-X-Zone
    </title>

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;

            background: #080808;
            color: white;

            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .error {
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            color: #ff6600;
        }

        p {
            color: #888;
        }

        button {
            padding: 10px 20px;

            border: none;
            border-radius: 6px;

            background: #ff6600;
            color: #000;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ff8533;
        }

    </style>

</head>

<body>

    <div class="error">

        <h1>
            Classroom-X-Zone
        </h1>

        <p>
            The portal could not be loaded.
        </p>

        <p>
            ${error.message}
        </p>

        <button
            onclick="location.reload()"
        >
            Retry
        </button>

    </div>

</body>

</html>
                        `);


                        portal.document.close();

                    } catch (writeError) {

                        console.error(
                            writeError
                        );

                    }

                }

            }


            /* =========================================================
               START
            ========================================================= */

            loadPortal();

        })();
    </script>

</body>
</html>
