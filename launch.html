<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launcher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    button {
      padding: 16px 30px;
      border: 0;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }
  </style>
</head>

<body>

  <button id="launchButton">Launch Site</button>

  <script>
    /*
     * ============================================================
     * CONFIG
     * ============================================================
     */

    const REPO =
      "https://cdn.jsdelivr.net/gh/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd@main/";

    const SITE_URL =
      REPO + "index.html";

    const GAME_BASE =
      REPO + "g/games/html/";


    /*
     * ============================================================
     * LAUNCHER
     * ============================================================
     */

    document
      .getElementById("launchButton")
      .addEventListener("click", launchSite);


    async function launchSite() {

      /*
       * Open about:blank immediately.
       */
      const win = window.open(
        "about:blank",
        "_blank"
      );

      if (!win) {
        alert(
          "Please allow popups for this site."
        );
        return;
      }


      /*
       * Show a temporary loading page.
       */
      win.document.open();

      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Loading...</title>
          <style>
            body {
              margin: 0;
              background: #080808;
              color: white;
              font-family: Arial, sans-serif;
              display: flex;
              align-items: center;
              justify-content: center;
              height: 100vh;
            }
          </style>
        </head>

        <body>
          Loading...
        </body>
        </html>
      `);

      win.document.close();


      try {

        /*
         * Fetch index.html from jsDelivr.
         */
        await loadPage(
          win,
          SITE_URL,
          REPO
        );

      } catch (error) {

        showError(
          win,
          error
        );
      }
    }


    /*
     * ============================================================
     * LOAD A NORMAL HTML PAGE
     * ============================================================
     */

    async function loadPage(
      win,
      url,
      baseURL
    ) {

      const response =
        await fetch(url);

      if (!response.ok) {

        throw new Error(
          "Failed to load page: " +
          url +
          " (" +
          response.status +
          ")"
        );
      }


      const html =
        await response.text();


      /*
       * Parse the HTML.
       */
      const parser =
        new DOMParser();

      const doc =
        parser.parseFromString(
          html,
          "text/html"
        );


      /*
       * Fix CSS, JS, images, etc.
       */
      fixResources(
        doc,
        baseURL
      );


      /*
       * Convert internal links
       * into virtual links.
       */
      fixLinks(
        doc,
        baseURL
      );


      /*
       * Write the page into the SAME
       * about:blank tab.
       */
      win.document.open();

      win.document.write(
        "<!DOCTYPE html>\n" +
        doc.documentElement.outerHTML
      );

      win.document.close();


      /*
       * Install the virtual navigation
       * system into the newly loaded page.
       */
      installNavigation(
        win
      );


      /*
       * Set the title.
       */
      if (doc.title) {
        win.document.title =
          doc.title;
      }
    }


    /*
     * ============================================================
     * LOAD A GAME
     * ============================================================
     */

    async function loadGame(
      win,
      url
    ) {

      const response =
        await fetch(url);

      if (!response.ok) {

        throw new Error(
          "Failed to load game: " +
          url +
          " (" +
          response.status +
          ")"
        );
      }


      let html =
        await response.text();


      /*
       * Parse the game HTML.
       */
      const parser =
        new DOMParser();

      const doc =
        parser.parseFromString(
          html,
          "text/html"
        );


      /*
       * Game files are located inside:
       *
       * /g/games/html/
       *
       * Therefore ./something.js,
       * ./something.css, etc. should
       * resolve from that directory.
       */
      fixResources(
        doc,
        GAME_BASE
      );


      /*
       * Fix links inside the game.
       */
      fixLinks(
        doc,
        GAME_BASE
      );


      /*
       * Put the game directly into
       * the existing about:blank tab.
       */
      win.document.open();

      win.document.write(
        "<!DOCTYPE html>\n" +
        doc.documentElement.outerHTML
      );

      win.document.close();


      /*
       * Reinstall navigation.
       */
      installNavigation(
        win
      );


      /*
       * Set game title.
       */
      if (doc.title) {
        win.document.title =
          doc.title;
      }
    }


    /*
     * ============================================================
     * FIX RESOURCES
     * ============================================================
     *
     * Changes:
     *
     * ./style.css
     *        ↓
     * https://cdn.jsdelivr.net/.../style.css
     *
     * ./game.js
     *        ↓
     * https://cdn.jsdelivr.net/.../game.js
     */

    function fixResources(
      doc,
      baseURL
    ) {

      const attributes = [
        "src",
        "href",
        "poster",
        "action"
      ];


      for (
        const attribute
        of attributes
      ) {

        const elements =
          doc.querySelectorAll(
            "[" + attribute + "]"
          );


        for (
          const element
          of elements
        ) {

          const value =
            element.getAttribute(
              attribute
            );


          if (!value) {
            continue;
          }


          /*
           * Don't modify special URLs.
           */
          if (
            value.startsWith("data:") ||
            value.startsWith("blob:") ||
            value.startsWith("javascript:") ||
            value.startsWith("mailto:") ||
            value.startsWith("tel:") ||
            value.startsWith("#") ||
            /^[a-z][a-z0-9+.-]*:/i.test(value)
          ) {
            continue;
          }


          try {

            const absoluteURL =
              new URL(
                value,
                baseURL
              ).href;


            element.setAttribute(
              attribute,
              absoluteURL
            );

          } catch (error) {

            console.warn(
              "Could not resolve resource:",
              value
            );
          }
        }
      }
    }


    /*
     * ============================================================
     * FIX INTERNAL LINKS
     * ============================================================
     *
     * Instead of allowing:
     *
     * about:blank -> jsDelivr/player.html
     *
     * we store the URL in:
     *
     * data-virtual-url
     *
     * and fetch it ourselves.
     */

    function fixLinks(
      doc,
      baseURL
    ) {

      const links =
        doc.querySelectorAll(
          "a[href]"
        );


      for (
        const link
        of links
      ) {

        const href =
          link.getAttribute(
            "href"
          );


        if (!href) {
          continue;
        }


        /*
         * Don't modify these.
         */
        if (
          href.startsWith("#") ||
          href.startsWith("javascript:") ||
          href.startsWith("mailto:") ||
          href.startsWith("tel:")
        ) {
          continue;
        }


        let absoluteURL;


        try {

          absoluteURL =
            new URL(
              href,
              baseURL
            ).href;

        } catch (error) {

          continue;
        }


        /*
         * Only intercept files
         * belonging to our CDN repo.
         */
        if (
          !absoluteURL.startsWith(REPO)
        ) {
          continue;
        }


        /*
         * Store the URL without
         * changing the visible link.
         */
        link.dataset.virtualUrl =
          absoluteURL;


        /*
         * Remove href so the browser
         * cannot navigate away.
         */
        link.removeAttribute(
          "href"
        );


        link.style.cursor =
          "pointer";
      }
    }


    /*
     * ============================================================
     * VIRTUAL NAVIGATION
     * ============================================================
     */

    function installNavigation(
      win
    ) {

      const doc =
        win.document;


      /*
       * Avoid duplicate listeners.
       */
      if (
        doc.documentElement.dataset
          .virtualNavigationInstalled === "true"
      ) {
        return;
      }


      doc.documentElement.dataset
        .virtualNavigationInstalled =
        "true";


      doc.addEventListener(
        "click",
        async function(event) {

          /*
           * Find the clicked link.
           */
          const link =
            event.target.closest(
              "[data-virtual-url]"
            );


          if (!link) {
            return;
          }


          /*
           * Stop normal navigation.
           */
          event.preventDefault();

          event.stopPropagation();


          const url =
            link.dataset.virtualUrl;


          if (!url) {
            return;
          }


          try {

            /*
             * Check whether this is a game.
             */
            if (
              url.startsWith(GAME_BASE)
            ) {

              await loadGame(
                win,
                url
              );

            } else {

              /*
               * Normal site page.
               */
              await loadPage(
                win,
                url,
                getDirectory(url)
              );
            }

          } catch (error) {

            showError(
              win,
              error
            );
          }

        },
        true
      );
    }


    /*
     * ============================================================
     * GET DIRECTORY
     * ============================================================
     */

    function getDirectory(
      url
    ) {

      const lastSlash =
        url.lastIndexOf("/");


      if (
        lastSlash === -1
      ) {
        return REPO;
      }


      return url.substring(
        0,
        lastSlash + 1
      );
    }


    /*
     * ============================================================
     * ERROR PAGE
     * ============================================================
     */

    function showError(
      win,
      error
    ) {

      const message =
        String(
          error &&
          error.message
            ? error.message
            : error
        );


      win.document.open();

      win.document.write(`
        <!DOCTYPE html>

        <html>

        <head>
          <title>Error</title>

          <style>
            body {
              margin: 0;
              padding: 40px;
              background: #080808;
              color: white;
              font-family: Arial, sans-serif;
            }

            h1 {
              color: #ef4444;
            }

            pre {
              white-space: pre-wrap;
              background: #151515;
              padding: 15px;
              border-radius: 8px;
            }
          </style>
        </head>

        <body>

          <h1>
            Unable to load page
          </h1>

          <pre>${escapeHTML(message)}</pre>

        </body>

        </html>
      `);

      win.document.close();
    }


    /*
     * ============================================================
     * ESCAPE ERROR TEXT
     * ============================================================
     */

    function escapeHTML(
      text
    ) {

      return String(text)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }
  </script>

</body>
</html>
