async function launch() {

  /*
   * Open about:blank immediately.
   */
  const tab = window.open("about:blank", "_blank");

  if (!tab) {
    alert("Please allow popups.");
    return;
  }

  /*
   * Loading screen.

      Loading...
    </body>

  `);

    /*
     * Fetch the actual index.html.
     */
    const response = await fetch(INDEX_URL);

    if (!response.ok)
      throw new Error("Could not fetch index.html");

    let html = await response.text();

     * Convert links into local virtual navigation.
     *
     * Instead of:

     *

     */

        padding:40px;

        <p>${escapeHTML(error.message)}</p>
      </body>
    `);

    tab.document.close();
  }
}


/*
 * Convert normal page links into virtual navigation.
 */
function convertNavigation(html) {

  /*
   * href="player.html"
   */
  html = html.replace(
    /href=["'](?:\.\/)?([^"'#?]+\.html)(?:\?([^"']*))?["']/gi,
    function(match, page, query) {

      if (
        page.startsWith("http://") ||
        page.startsWith("https://") ||
        page.startsWith("javascript:")
      ) {
        return match;
      }

      const encodedPage =
        encodeURIComponent(page);

      const encodedQuery =
        query
          ? encodeURIComponent(query)
          : "";

      return `href="javascript:virtualPage('${encodedPage}','${encodedQuery}')"`;
    }
  );

  return html;
}


/*
 * Convert game links.
 */
function convertGames(html) {

  /*
   * ./g/games/html/game.html
   */
  html = html.replace(
    /href=["'](?:\.\/)?g\/games\/html\/([^"'#?]+)(?:\?([^"']*))?["']/gi,
    function(match, game, query) {

      const encodedGame =
        encodeURIComponent(game);

      const encodedQuery =
        query
          ? encodeURIComponent(query)
          : "";

      return `href="javascript:virtualGame('${encodedGame}','${encodedQuery}')"`;
    }
  );


  /*
   * ./g/game.html
   */
  html = html.replace(
    /href=["'](?:\.\/)?g\/([^"'#?]+\.html)(?:\?([^"']*))?["']/gi,
    function(match, game, query) {

      const encodedGame =

          : "";

      return `href="javascript:virtualGame('${encodedGame}','${encodedQuery}')"`;
    }
  );

}


/*
 * Rewrite assets so they continue working
 * inside about:blank.
 */
function convertAssets(html) {

  /*
   * images
   */
  html = html.replace(
    /(["'(])\.\/(images\/[^"'()\s]+)/gi,
    `$1${REPO}$2`
  );

  /*
   * g/assets
   */
  html = html.replace(
    /(["'(])\.\/(g\/assets\/[^"'()\s]+)/gi,
    `$1${REPO}$2`
  );

  /*
   * css
   */
  html = html.replace(
    /(["'(])\.\/(css\/[^"'()\s]+)/gi,
    `$1${REPO}$2`
  );

  /*
   * js
   */
  html = html.replace(
    /(["'(])\.\/(js\/[^"'()\s]+)/gi,
    `$1${REPO}$2`
  );

  return html;
}
