<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classroom-X-Zone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #080808;
            z-index: 9999;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .logo span {
            color: #ff6600;
        }

        .loader {
            width: 220px;
            height: 5px;
            overflow: hidden;
            border-radius: 10px;
            background: #222;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: #ff6600;
            box-shadow: 0 0 12px #ff6600;
            animation: loading 1.5s ease-in-out forwards;
        }

        @keyframes loading {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        .status {
            margin-top: 15px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="logo">
            CLASSROOM<span>-X</span>-ZONE
        </div>

        <div class="loader">
            <div class="loader-bar"></div>
        </div>

        <div class="status" id="status">
            Starting...
        </div>
    </div>

    <script>
        (() => {
            /* =========================================================
               CONFIG
            ========================================================= */

            const MAIN_URL =
                "https://cdn.jsdelivr.net/gh/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd@main/index.html";

            const status = document.getElementById("status");

            function setStatus(text) {
                status.textContent = text;
            }

            /* =========================================================
               CREATE ABOUT:BLANK TAB
            ========================================================= */

            const appWindow = window.open(
                "about:blank",
                "_blank"
            );

            if (!appWindow) {
                setStatus(
                    "Popup blocked. Allow popups and try again."
                );

                throw new Error("Popup blocked");
            }

            /* =========================================================
               FETCH MAIN SITE
            ========================================================= */

            async function launch() {
                try {
                    setStatus(
                        "Loading Classroom-X-Zone..."
                    );

                    const response = await fetch(
                        MAIN_URL,
                        {
                            cache: "no-store"
                        }
                    );

                    if (!response.ok) {
                        throw new Error(
                            "HTTP " + response.status
                        );
                    }

                    let html = await response.text();

                    setStatus(
                        "Preparing portal..."
                    );

                    /* =================================================
                       SET BASE URL
                    ================================================= */

                    const baseURL =
                        MAIN_URL.substring(
                            0,
                            MAIN_URL.lastIndexOf("/") + 1
                        );

                    /*
                     * Add a <base> tag so relative resources
                     * continue working inside about:blank.
                     */

                    if (/<head[^>]*>/i.test(html)) {
                        html = html.replace(
                            /<head([^>]*)>/i,
                            `<head$1>
<base href="${baseURL}">
`
                        );
                    } else {
                        html =
                            `<base href="${baseURL}">` +
                            html;
                    }

                    /* =================================================
                       LAUNCHER INFORMATION
                    ================================================= */

                    const launcherScript = `
<script>
    window.__CXZ_LAUNCHED__ = true;

    window.__CXZ_SOURCE_URL__ =
        ${JSON.stringify(MAIN_URL)};
<\/script>
`;

                    html = html.replace(
                        /<\/head>/i,
                        launcherScript + "</head>"
                    );

                    /* =================================================
                       INTERNAL NAVIGATION ROUTER
                    ================================================= */

                    const router = `
<script>
(() => {
    const SOURCE_BASE =
        ${JSON.stringify(baseURL)};

    function resolve(url) {
        try {
            return new URL(
                url,
                SOURCE_BASE
            ).href;
        } catch {
            return url;
        }
    }

    function isInternal(url) {
        try {
            const u = new URL(
                url,
                SOURCE_BASE
            );

            return (
                u.origin ===
                    new URL(SOURCE_BASE).origin ||
                u.href.startsWith(SOURCE_BASE)
            );

        } catch {
            return false;
        }
    }

    async function loadPage(url) {
        const absoluteURL = resolve(url);

        try {
            const response = await fetch(
                absoluteURL,
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            let page =
                await response.text();

            const pageBase =
                absoluteURL.substring(
                    0,
                    absoluteURL.lastIndexOf("/") + 1
                );

            /*
             * Remove any existing base tags.
             */

            page = page.replace(
                /<base[^>]*>/gi,
                ""
            );

            /*
             * Add the correct base URL.
             */

            if (/<head[^>]*>/i.test(page)) {
                page = page.replace(
                    /<head([^>]*)>/i,
                    `<head$1>
<base href="${pageBase}">
`
                );
            } else {
                page =
                    `<base href="${pageBase}">` +
                    page;
            }

            /*
             * Replace the current document.
             */

            document.open();
            document.write(page);
            document.close();

        } catch (error) {
            document.body.innerHTML = `
                <div style="
                    width: 100%;
                    height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #080808;
                    color: white;
                    font-family: Arial;
                    text-align: center;
                ">
                    <div>
                        <h2>
                            Unable to load page
                        </h2>

                        <p style="color: #888;">
                            ${error.message}
                        </p>

                        <button
                            onclick="location.reload()"
                            style="
                                padding: 10px 18px;
                                border: 0;
                                border-radius: 6px;
                                background: #ff6600;
                                color: #000;
                                cursor: pointer;
                            "
                        >
                            Retry
                        </button>
                    </div>
                </div>
            `;
        }
    }

    /* =============================================================
       INTERCEPT INTERNAL LINKS
    ============================================================= */

    document.addEventListener(
        "click",
        event => {
            const link =
                event.target.closest("a");

            if (!link) {
                return;
            }

            const href =
                link.getAttribute("href");

            if (!href) {
                return;
            }

            /*
             * Leave anchors, mail links, telephone
             * links, and javascript links alone.
             */

            if (
                href.startsWith("#") ||
                href.startsWith("mailto:") ||
                href.startsWith("tel:") ||
                href.startsWith("javascript:")
            ) {
                return;
            }

            const absolute =
                resolve(href);

            if (isInternal(absolute)) {
                event.preventDefault();
                event.stopPropagation();

                loadPage(absolute);
            }
        },
        true
    );

    /* =============================================================
       INTERCEPT window.open()
    ============================================================= */

    const originalOpen =
        window.open;

    window.open = function(
        url,
        target,
        features
    ) {
        if (url && isInternal(url)) {
            loadPage(url);
            return window;
        }

        return originalOpen.call(
            window,
            url,
            target,
            features
        );
    };

})();
<\/script>
`;

                    /* =================================================
                       INSERT ROUTER
                    ================================================= */

                    html = html.replace(
                        /<\/body>/i,
                        router + "</body>"
                    );

                    /* =================================================
                       WRITE INTO ABOUT:BLANK
                    ================================================= */

                    appWindow.document.open();

                    appWindow.document.write(
                        html
                    );

                    appWindow.document.close();

                    setStatus(
                        "Launching..."
                    );

                    /* =================================================
                       CLOSE LAUNCHER PAGE
                    ================================================= */

                    setTimeout(() => {
                        window.close();
                    }, 500);

                } catch (error) {
                    setStatus(
                        "Failed to load: " +
                        error.message
                    );

                    try {
                        appWindow.document.open();

                        appWindow.document.write(`
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Classroom-X-Zone</title>
</head>

<body style="
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
">

    <div>
        <h1>
            Classroom-X-Zone
        </h1>

        <p style="color: #888;">
            Failed to load the portal.
        </p>

        <p style="color: #666;">
            ${error.message}
        </p>

        <button
            onclick="location.reload()"
            style="
                padding: 10px 20px;
                border: 0;
                border-radius: 6px;
                background: #ff6600;
                color: #000;
                cursor: pointer;
            "
        >
            Retry
        </button>
    </div>

</body>
</html>
                        `);

                        appWindow.document.close();

                    } catch {
                        // Nothing else to do.
                    }
                }
            }

            launch();
        })();
    </script>

</body>
</html>
