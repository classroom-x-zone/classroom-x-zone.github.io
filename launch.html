<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classroom-X-Zone</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #launch {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            z-index: 999999;
        }

        #launch button {
            border: 0;
            border-radius: 12px;
            padding: 16px 28px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>

<div id="launch">
    <button onclick="openClassroom()">Open Classroom-X-Zone</button>
</div>

<script>
const REPO =
    "https://cdn.jsdelivr.net/gh/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd@main/";

const SITE_URL = REPO + "index.html";
const GAME_BASE = REPO + "g/games/html/";


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   MAKE A URL ABSOLUTE
========================================================= */

function absoluteURL(value, base) {
    if (!value) return value;

    value = value.trim();

    if (
        value.startsWith("#") ||
        value.startsWith("data:") ||
        value.startsWith("blob:") ||
        value.startsWith("javascript:") ||
        value.startsWith("mailto:") ||
        value.startsWith("tel:")
    ) {
        return value;
    }

    try {
        return new URL(value, base).href;
    } catch {
        return value;
    }
}


/* =========================================================
   GET THE VIRTUAL QUERY STRING
========================================================= */

function getVirtualSearch(url) {
    try {
        return new URL(url, REPO).search || "";
    } catch {
        return "";
    }
}


/* =========================================================
   GET THE VIRTUAL DIRECTORY
========================================================= */

function getDirectory(url) {
    try {
        const u = new URL(url, REPO);
        u.pathname = u.pathname.substring(
            0,
            u.pathname.lastIndexOf("/") + 1
        );
        u.search = "";
        u.hash = "";
        return u.href;
    } catch {
        return REPO;
    }
}


/* =========================================================
   REWRITE LOCATION SEARCH
   THIS IS THE IMPORTANT FIX
========================================================= */

function rewriteQueryAccess(html) {

    /*
        The real about:blank page has:

            location.search === ""

        So we replace the site's query lookups with:

            window.__CXZ_SEARCH__

        which contains the query from the virtual URL.
    */

    html = html.replace(
        /\bwindow\.location\.search\b/g,
        "window.__CXZ_SEARCH__"
    );

    html = html.replace(
        /\blocation\.search\b/g,
        "window.__CXZ_SEARCH__"
    );

    return html;
}


/* =========================================================
   REWRITE INTERNAL LOCATION NAVIGATION
========================================================= */

function rewriteInternalLocationNavigation(html) {

    /*
        player.html contains:

            window.location.href = '../../../index.html';

        That would navigate the actual about:blank page.

        Replace internal index navigation with our virtual router.
    */

    html = html.replace(
        /window\.location\.href\s*=\s*(['"`])([^'"`]+)\1/g,
        function(match, quote, url) {

            if (
                url.startsWith("http://") ||
                url.startsWith("https://") ||
                url.startsWith("//")
            ) {
                return match;
            }

            return "__CXZ_NAVIGATE__(" + JSON.stringify(url) + ")";
        }
    );

    return html;
}


/* =========================================================
   FIX RESOURCE URLS
========================================================= */

function fixResources(doc, baseURL) {

    const attributes = [
        "src",
        "href",
        "poster",
        "action"
    ];

    for (const attr of attributes) {

        doc.querySelectorAll("[" + attr + "]").forEach(el => {

            const value = el.getAttribute(attr);

            if (!value) return;

            if (
                value.startsWith("#") ||
                value.startsWith("data:") ||
                value.startsWith("blob:") ||
                value.startsWith("javascript:") ||
                value.startsWith("mailto:") ||
                value.startsWith("tel:")
            ) {
                return;
            }

            el.setAttribute(
                attr,
                absoluteURL(value, baseURL)
            );
        });
    }
}


/* =========================================================
   FIX INTERNAL LINKS
========================================================= */

function fixLinks(doc, currentURL) {

    doc.querySelectorAll("a[href]").forEach(link => {

        const href = link.getAttribute("href");

        if (!href) return;

        if (
            href.startsWith("#") ||
            href.startsWith("javascript:") ||
            href.startsWith("mailto:") ||
            href.startsWith("tel:")
        ) {
            return;
        }

        let target;

        try {
            target = new URL(href, currentURL);
        } catch {
            return;
        }

        /*
            Only intercept links belonging to our jsDelivr repo.
        */

        if (
            target.origin === new URL(REPO).origin &&
            target.href.startsWith(REPO)
        ) {
            link.setAttribute(
                "data-cxz-url",
                target.href
            );

            /*
                Keep href harmless so the browser does not
                leave the about:blank document.
            */

            link.setAttribute("href", "#");
        }
    });
}


/* =========================================================
   INJECT VIRTUAL ROUTER API
========================================================= */

function injectRouterScript(doc) {

    const script = doc.createElement("script");

    script.textContent = `
        window.__CXZ_SEARCH__ =
            ${JSON.stringify(window.__CXZ_SEARCH__ || "")};

        window.__CXZ_VIRTUAL_URL__ =
            ${JSON.stringify(window.__CXZ_VIRTUAL_URL__ || SITE_URL)};

        window.__CXZ_NAVIGATE__ = function(url) {

            try {

                const absolute =
                    new URL(
                        url,
                        window.__CXZ_VIRTUAL_URL__
                    ).href;

                if (
                    typeof window.__CXZ_LOAD_PAGE__ === "function"
                ) {
                    window.__CXZ_LOAD_PAGE__(absolute);
                }

            } catch (e) {
                console.error("CXZ navigation error:", e);
            }
        };

        window.virtualNavigate =
            window.__CXZ_NAVIGATE__;

        window.virtualGame =
            window.__CXZ_NAVIGATE__;
    `;

    doc.head.prepend(script);
}


/* =========================================================
   INSTALL CLICK HANDLER
========================================================= */

function installClickRouter(win) {

    win.document.addEventListener(
        "click",
        function(event) {

            const link =
                event.target.closest("[data-cxz-url]");

            if (!link) return;

            const url =
                link.getAttribute("data-cxz-url");

            if (!url) return;

            event.preventDefault();
            event.stopPropagation();

            if (
                typeof win.__CXZ_LOAD_PAGE__ === "function"
            ) {
                win.__CXZ_LOAD_PAGE__(url);
            }

        },
        true
    );
}


/* =========================================================
   INSTALL VIRTUAL LOCATION HELPERS
========================================================= */

function installVirtualAPIs(win) {

    win.__CXZ_LOAD_PAGE__ = function(url) {
        loadVirtualPage(win, url);
    };

    win.__CXZ_NAVIGATE__ = function(url) {

        const absolute =
            new URL(
                url,
                win.__CXZ_VIRTUAL_URL__ || SITE_URL
            ).href;

        loadVirtualPage(win, absolute);
    };

    win.virtualNavigate =
        win.__CXZ_NAVIGATE__;

    win.virtualGame =
        win.__CXZ_NAVIGATE__;
}


/* =========================================================
   FETCH HTML
========================================================= */

async function fetchHTML(url) {

    const response = await fetch(url, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            "HTTP " +
            response.status +
            " while loading " +
            url
        );
    }

    return await response.text();
}


/* =========================================================
   LOAD NORMAL SITE PAGE
========================================================= */

async function loadVirtualPage(win, requestedURL) {

    try {

        let url =
            new URL(
                requestedURL,
                REPO
            ).href;

        /*
            Normalize index.html.
        */

        if (url.endsWith("/")) {
            url += "index.html";
        }

        const isPlayer =
            url.includes("/g/games/html/player.html");

        const isGame =
            url.includes("/g/games/html/") &&
            !isPlayer;

        const baseURL =
            isGame || isPlayer
                ? GAME_BASE
                : getDirectory(url);

        let html =
            await fetchHTML(url);

        /*
            Store the virtual URL and query BEFORE
            the fetched site's scripts execute.
        */

        win.__CXZ_VIRTUAL_URL__ = url;
        win.__CXZ_SEARCH__ =
            getVirtualSearch(url);

        /*
            CRITICAL:
            Make window.location.search work virtually.
        */

        html =
            rewriteQueryAccess(html);

        /*
            Fix direct window.location.href navigation.
        */

        html =
            rewriteInternalLocationNavigation(html);


        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                html,
                "text/html"
            );


        /* =====================================================
           BASE URL
        ===================================================== */

        let base =
            doc.querySelector("base");

        if (!base) {

            base =
                doc.createElement("base");

            doc.head.prepend(base);
        }

        base.href = baseURL;


        /* =====================================================
           RESOURCES
        ===================================================== */

        fixResources(
            doc,
            baseURL
        );


        /* =====================================================
           INTERNAL LINKS
        ===================================================== */

        fixLinks(
            doc,
            url
        );


        /* =====================================================
           ROUTER API
        ===================================================== */

        injectRouterScript(doc);


        /*
            Tell player.html exactly which URL it is supposed
            to load.
        */

        if (isPlayer) {

            const params =
                new URL(
                    url
                ).searchParams;

            const game =
                params.get("url");

            const title =
                params.get("title");

            if (game) {

                const iframe =
                    doc.querySelector("#game-iframe");

                if (iframe) {

                    iframe.setAttribute(
                        "data-cxz-game-url",
                        game
                    );
                }
            }

            /*
                Replace the player's query parser so it
                always gets our virtual parameters.
            */

            const scripts =
                doc.querySelectorAll("script");

            scripts.forEach(script => {

                if (!script.textContent) return;

                script.textContent =
                    script.textContent
                        .replace(
                            /new\s+URLSearchParams\s*\(\s*window\.location\.search\s*\)/g,
                            "new URLSearchParams(window.__CXZ_SEARCH__)"
                        )
                        .replace(
                            /new\s+URLSearchParams\s*\(\s*location\.search\s*\)/g,
                            "new URLSearchParams(window.__CXZ_SEARCH__)"
                        );
            });
        }


        /* =====================================================
           WRITE PAGE
        ===================================================== */

        win.document.open();

        win.document.write(
            "<!DOCTYPE html>" +
            doc.documentElement.outerHTML
        );

        win.document.close();


        /*
            Re-install APIs after document replacement.
        */

        win.__CXZ_VIRTUAL_URL__ = url;
        win.__CXZ_SEARCH__ =
            getVirtualSearch(url);

        installVirtualAPIs(win);
        installClickRouter(win);


        /* =====================================================
           SPECIAL PLAYER FIX
        ===================================================== */

        if (isPlayer) {

            const params =
                new URL(
                    url
                ).searchParams;

            const gameURL =
                params.get("url");

            if (gameURL) {

                const iframe =
                    win.document.querySelector(
                        "#game-iframe"
                    );

                if (iframe) {

                    /*
                        Resolve relative game paths from
                        the actual game directory.
                    */

                    const resolvedGame =
                        absoluteURL(
                            gameURL,
                            GAME_BASE
                        );

                    iframe.setAttribute(
                        "data-cxz-resolved-game",
                        resolvedGame
                    );


                    /*
                        The original player has a delayed
                        iframe.src = gameUrl.

                        Override the iframe's src property
                        so relative URLs resolve correctly.
                    */

                    try {

                        iframe.src =
                            resolvedGame;

                    } catch (e) {

                        console.error(
                            "Game iframe error:",
                            e
                        );
                    }
                }
            }
        }

    } catch (error) {

        console.error(error);

        win.document.open();

        win.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>Classroom-X-Zone Error</title>

                <style>
                    body {
                        margin: 0;
                        background: #050505;
                        color: white;
                        font-family: Arial, sans-serif;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        min-height: 100vh;
                    }

                    .error {
                        max-width: 700px;
                        padding: 30px;
                        border-radius: 15px;
                        background: #111;
                        border: 1px solid #333;
                    }

                    h1 {
                        margin-top: 0;
                    }

                    pre {
                        white-space: pre-wrap;
                        color: #ff7777;
                    }
                </style>
            </head>

            <body>

                <div class="error">

                    <h1>Classroom-X-Zone</h1>

                    <p>
                        The page could not be loaded.
                    </p>

                    <pre>${escapeHTML(error.message)}</pre>

                </div>

            </body>
            </html>
        `);

        win.document.close();
    }
}


/* =========================================================
   OPEN ABOUT:BLANK
========================================================= */

async function openClassroom() {

    const win =
        window.open(
            "about:blank",
            "_blank"
        );

    if (!win) {

        alert(
            "Please allow popups for this site."
        );

        return;
    }


    /*
        Install the router before loading index.html.
    */

    installVirtualAPIs(win);


    /*
        Load the actual site.
    */

    await loadVirtualPage(
        win,
        SITE_URL
    );
}
</script>

</body>
</html>
