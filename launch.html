<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loading...</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        #hk {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 999999;

            background: transparent;
        }

        #hk:hover {
            background: rgba(0, 0, 0, 0.01);
        }

        #loading {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            z-index: 1000000;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        #loading.hidden {
            display: none;
        }

        .loading-box {
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;

            margin: 0 auto 14px;

            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #status {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="loading-box">
            <div class="spinner"></div>

            <div id="status">
                Loading...
            </div>
        </div>
    </div>

    <div id="hk"></div>

    <script>
        (() => {
            const SITE_URL =
                "https://raw.githubusercontent.com/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd/refs/heads/main/index.html";

            const hk =
                document.getElementById("hk");

            const loading =
                document.getElementById("loading");

            const status =
                document.getElementById("status");


            /*
             * Keep the launcher focused.
             */
            hk.addEventListener(
                "mousedown",
                (event) => {
                    event.preventDefault();
                    window.focus();
                }
            );


            /*
             * Open the fetched site in an
             * about:blank tab.
             */
            function openSiteInBlankTab(html) {
                const newWindow =
                    window.open(
                        "about:blank",
                        "_blank"
                    );

                if (!newWindow) {
                    status.textContent =
                        "Please allow pop-ups and try again.";

                    loading.classList.remove(
                        "hidden"
                    );

                    return false;
                }

                const doc =
                    newWindow.document;

                doc.open();

                doc.write(html);

                doc.close();

                return true;
            }


            /*
             * Fetch the site's index.html.
             */
            async function launch() {
                try {
                    status.textContent =
                        "Fetching site...";

                    const response =
                        await fetch(
                            SITE_URL,
                            {
                                cache: "no-store"
                            }
                        );

                    if (!response.ok) {
                        throw new Error(
                            `HTTP ${response.status}`
                        );
                    }

                    status.textContent =
                        "Starting site...";

                    const html =
                        await response.text();

                    if (!html.trim()) {
                        throw new Error(
                            "The site returned empty HTML."
                        );
                    }


                    /*
                     * Open the fetched HTML
                     * inside about:blank.
                     */
                    const opened =
                        openSiteInBlankTab(
                            html
                        );

                    if (!opened) {
                        return;
                    }


                    /*
                     * Clear the launcher page after
                     * the new tab has been created.
                     */
                    setTimeout(
                        () => {
                            document.open();

                            document.write(`
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>

<body>
</body>
</html>
                            `);

                            document.close();
                        },
                        100
                    );

                } catch (error) {
                    console.error(
                        "Launcher error:",
                        error
                    );

                    status.textContent =
                        "Failed to load. Retrying...";

                    setTimeout(
                        launch,
                        1500
                    );
                }
            }


            /*
             * Start the launcher.
             */
            launch();
        })();
    </script>

</body>
</html>
