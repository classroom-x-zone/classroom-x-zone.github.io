<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom-X-Zone Launcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #080808;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        #launchButton {
            padding: 16px 30px;
            border: 0;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #launchButton:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

    <button id="launchButton">
        Launch Site
    </button>

    <script>
        /*
         * ============================================================
         * CONFIGURATION
         * ============================================================
         */

        const REPO =
            "https://cdn.jsdelivr.net/gh/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd@main/";

        const SITE_URL =
            REPO + "index.html";

        const GAME_BASE =
            REPO + "g/games/html/";


        /*
         * ============================================================
         * LAUNCH
         * ============================================================
         */

        document
            .getElementById("launchButton")
            .addEventListener("click", launchSite);


        async function launchSite() {

            /*
             * Open the about:blank tab immediately.
             */
            const win =
                window.open("about:blank", "_blank");


            if (!win) {
                alert(
                    "Please allow popups for this site."
                );
                return;
            }


            /*
             * Temporary loading screen.
             */
            win.document.open();

            win.document.write(`
                <!DOCTYPE html>

                <html>
                <head>
                    <title>Loading...</title>

                    <style>
                        html,
                        body {
                            margin: 0;
                            width: 100%;
                            height: 100%;
                            background: #080808;
                            color: white;
                            font-family: Arial, sans-serif;
                        }

                        body {
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        }
                    </style>
                </head>

                <body>
                    Loading Classroom-X-Zone...
                </body>

                </html>
            `);

            win.document.close();


            try {

                /*
                 * Load the actual index page.
                 */
                await loadVirtualPage(
                    win,
                    SITE_URL,
                    REPO
                );

            } catch (error) {

                showError(
                    win,
                    error
                );
            }
        }


        /*
         * ============================================================
         * LOAD VIRTUAL PAGE
         * ============================================================
         *
         * This fetches the HTML but NEVER navigates the browser
         * to the jsDelivr URL.
         */

        async function loadVirtualPage(
            win,
            url,
            baseURL
        ) {

            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Failed to fetch:\n" +
                    url +
                    "\n\nHTTP " +
                    response.status
                );
            }


            const html =
                await response.text();


            /*
             * Parse the downloaded HTML.
             */
            const parser =
                new DOMParser();

            const doc =
                parser.parseFromString(
                    html,
                    "text/html"
                );


            /*
             * --------------------------------------------------------
             * VERY IMPORTANT
             * --------------------------------------------------------
             *
             * Add a <base> element.
             *
             * This fixes things like player.html:
             *
             *     iframe.src = "gd.html"
             *
             * Without this, the browser tries:
             *
             *     about:blank/gd.html
             *
             * With this, it correctly uses:
             *
             *     /g/games/html/gd.html
             */

            setBaseURL(
                doc,
                baseURL
            );


            /*
             * Fix relative resources.
             */
            fixResources(
                doc,
                baseURL
            );


            /*
             * Mark internal links for our
             * virtual navigation system.
             */
            fixInternalLinks(
                doc,
                baseURL
            );


            /*
             * Add a small script before the
             * page's existing scripts execute.
             *
             * This makes virtual navigation
             * available to the site's own code.
             */
            injectNavigationAPI(
                doc
            );


            /*
             * Replace the CURRENT about:blank
             * document.
             */
            win.document.open();

            win.document.write(
                "<!DOCTYPE html>\n" +
                doc.documentElement.outerHTML
            );

            win.document.close();


            /*
             * Install click interception after
             * the page exists.
             */
            installNavigation(
                win
            );


            /*
             * Set title.
             */
            if (doc.title) {
                win.document.title =
                    doc.title;
            }
        }


        /*
         * ============================================================
         * SET BASE URL
         * ============================================================
         */

        function setBaseURL(
            doc,
            baseURL
        ) {

            let base =
                doc.querySelector("base");


            if (!base) {

                base =
                    doc.createElement("base");

                doc.head.prepend(
                    base
                );
            }


            /*
             * Make all relative URLs use
             * the virtual CDN location.
             */
            base.href =
                baseURL;
        }


        /*
         * ============================================================
         * FIX RESOURCES
         * ============================================================
         *
         * Converts relative resources such as:
         *
         * ./game.js
         * ./style.css
         * ./assets/image.png
         *
         * into CDN URLs.
         */

        function fixResources(
            doc,
            baseURL
        ) {

            const attributes = [
                "src",
                "href",
                "poster",
                "action"
            ];


            for (
                const attribute
                of attributes
            ) {

                const elements =
                    doc.querySelectorAll(
                        "[" + attribute + "]"
                    );


                for (
                    const element
                    of elements
                ) {

                    const value =
                        element.getAttribute(
                            attribute
                        );


                    if (!value) {
                        continue;
                    }


                    /*
                     * Leave special URLs alone.
                     */
                    if (
                        value.startsWith("data:") ||
                        value.startsWith("blob:") ||
                        value.startsWith("javascript:") ||
                        value.startsWith("mailto:") ||
                        value.startsWith("tel:") ||
                        value.startsWith("#") ||
                        /^[a-z][a-z0-9+.-]*:/i.test(value)
                    ) {
                        continue;
                    }


                    try {

                        const absolute =
                            new URL(
                                value,
                                baseURL
                            ).href;


                        element.setAttribute(
                            attribute,
                            absolute
                        );

                    } catch (error) {

                        console.warn(
                            "Could not resolve:",
                            value
                        );
                    }
                }
            }
        }


        /*
         * ============================================================
         * FIX INTERNAL LINKS
         * ============================================================
         *
         * Example:
         *
         * ../../../index.html?tab=games
         *
         * becomes a virtual navigation target.
         */

        function fixInternalLinks(
            doc,
            baseURL
        ) {

            const links =
                doc.querySelectorAll(
                    "a[href]"
                );


            for (
                const link
                of links
            ) {

                const href =
                    link.getAttribute(
                        "href"
                    );


                if (!href) {
                    continue;
                }


                /*
                 * Leave anchors and special links alone.
                 */
                if (
                    href.startsWith("#") ||
                    href.startsWith("javascript:") ||
                    href.startsWith("mailto:") ||
                    href.startsWith("tel:")
                ) {
                    continue;
                }


                let absoluteURL;


                try {

                    absoluteURL =
                        new URL(
                            href,
                            baseURL
                        ).href;

                } catch (error) {

                    continue;
                }


                /*
                 * Only intercept our own CDN pages.
                 */
                if (
                    !absoluteURL.startsWith(REPO)
                ) {
                    continue;
                }


                /*
                 * Store the destination.
                 */
                link.dataset.virtualUrl =
                    absoluteURL;


                /*
                 * Remove href so clicking it
                 * cannot navigate away from
                 * about:blank.
                 */
                link.removeAttribute(
                    "href"
                );


                link.style.cursor =
                    "pointer";
            }
        }


        /*
         * ============================================================
         * NAVIGATION API
         * ============================================================
         *
         * Makes these available to pages:
         *
         * virtualNavigate(...)
         * virtualGame(...)
         */

        function injectNavigationAPI(
            doc
        ) {

            const script =
                doc.createElement("script");


            script.textContent = `
                window.__CXZ_REPO__ =
                    ${JSON.stringify(REPO)};

                window.__CXZ_GAME_BASE__ =
                    ${JSON.stringify(GAME_BASE)};

                window.virtualNavigate =
                    function(url) {

                        if (
                            typeof window.__CXZ_NAVIGATE__ ===
                            "function"
                        ) {
                            window.__CXZ_NAVIGATE__(url);
                        }
                    };

                window.virtualGame =
                    function(game) {

                        if (
                            typeof window.__CXZ_GAME__
                            === "function"
                        ) {
                            window.__CXZ_GAME__(game);
                        }
                    };
            `;


            /*
             * Put it at the beginning of head.
             */
            if (doc.head) {

                doc.head.prepend(
                    script
                );
            }
        }


        /*
         * ============================================================
         * INSTALL NAVIGATION
         * ============================================================
         */

        function installNavigation(
            win
        ) {

            const doc =
                win.document;


            /*
             * Make navigation functions available
             * to the page's own JavaScript.
             */
            win.__CXZ_NAVIGATE__ =
                async function(url) {

                    try {

                        if (
                            url.startsWith(
                                GAME_BASE
                            )
                        ) {

                            await loadGame(
                                win,
                                url
                            );

                        } else {

                            await loadVirtualPage(
                                win,
                                url,
                                getDirectory(url)
                            );
                        }

                    } catch (error) {

                        showError(
                            win,
                            error
                        );
                    }
                };


            win.__CXZ_GAME__ =
                async function(game) {

                    const url =
                        GAME_BASE +
                        game;

                    await loadGame(
                        win,
                        url
                    );
                };


            /*
             * Prevent duplicate click handlers.
             */
            if (
                doc.documentElement.dataset
                    .cxzNavigationInstalled === "true"
            ) {
                return;
            }


            doc.documentElement.dataset
                .cxzNavigationInstalled =
                "true";


            /*
             * Intercept clicks on virtual links.
             */
            doc.addEventListener(
                "click",
                function(event) {

                    const link =
                        event.target.closest(
                            "[data-virtual-url]"
                        );


                    if (!link) {
                        return;
                    }


                    event.preventDefault();

                    event.stopPropagation();


                    const url =
                        link.dataset.virtualUrl;


                    if (!url) {
                        return;
                    }


                    win.__CXZ_NAVIGATE__(
                        url
                    );

                },
                true
            );
        }


        /*
         * ============================================================
         * LOAD GAME
         * ============================================================
         *
         * This is the important part for player.html.
         *
         * If player.html does:
         *
         * iframe.src = "gd.html"
         *
         * the <base> element makes it become:
         *
         * .../g/games/html/gd.html
         */

        async function loadGame(
            win,
            url
        ) {

            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Failed to fetch game:\n" +
                    url +
                    "\n\nHTTP " +
                    response.status
                );
            }


            const html =
                await response.text();


            /*
             * Parse game HTML.
             */
            const parser =
                new DOMParser();

            const doc =
                parser.parseFromString(
                    html,
                    "text/html"
                );


            /*
             * Game-relative resources use
             * the game directory.
             */
            setBaseURL(
                doc,
                GAME_BASE
            );


            /*
             * Fix game CSS, JS, images, etc.
             */
            fixResources(
                doc,
                GAME_BASE
            );


            /*
             * Process internal links.
             */
            fixInternalLinks(
                doc,
                GAME_BASE
            );


            /*
             * Add virtual navigation API.
             */
            injectNavigationAPI(
                doc
            );


            /*
             * Put the game/page into the SAME
             * about:blank tab.
             */
            win.document.open();

            win.document.write(
                "<!DOCTYPE html>\n" +
                doc.documentElement.outerHTML
            );

            win.document.close();


            /*
             * Reinstall navigation.
             */
            installNavigation(
                win
            );


            if (doc.title) {
                win.document.title =
                    doc.title;
            }
        }


        /*
         * ============================================================
         * GET DIRECTORY
         * ============================================================
         */

        function getDirectory(
            url
        ) {

            const index =
                url.lastIndexOf("/");


            if (index === -1) {
                return REPO;
            }


            return url.substring(
                0,
                index + 1
            );
        }


        /*
         * ============================================================
         * ERROR PAGE
         * ============================================================
         */

        function showError(
            win,
            error
        ) {

            const message =
                error &&
                error.message
                    ? error.message
                    : String(error);


            win.document.open();

            win.document.write(`
                <!DOCTYPE html>

                <html>

                <head>
                    <title>Loading Error</title>

                    <style>
                        body {
                            margin: 0;
                            padding: 40px;
                            background: #080808;
                            color: white;
                            font-family: Arial, sans-serif;
                        }

                        h1 {
                            color: #ff4444;
                        }

                        pre {
                            background: #151515;
                            border: 1px solid #333;
                            border-radius: 8px;
                            padding: 15px;
                            white-space: pre-wrap;
                            overflow-wrap: anywhere;
                        }
                    </style>
                </head>

                <body>

                    <h1>
                        Unable to load page
                    </h1>

                    <pre>${escapeHTML(message)}</pre>

                </body>

                </html>
            `);

            win.document.close();
        }


        /*
         * ============================================================
         * ESCAPE HTML
         * ============================================================
         */

        function escapeHTML(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }
    </script>

</body>
</html>
