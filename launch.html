<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #hk {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: transparent;
    }

    #hk:hover {
      background: rgba(0, 0, 0, 0.01);
    }
  </style>
</head>

<body>
  <div id="hk"></div>

  <script>
    (() => {
      const hk = document.getElementById("hk");

      hk.addEventListener("mousedown", (e) => {
        e.preventDefault();
        window.focus();
      });

      const mirrors = [
        "https://raw.githubusercontent.com/shajhgsjhgajshgkjajasfhlkahlalfd/shajhgsjhgajshgkjajasfhlkahlalfd/refs/heads/main/index.html"
      ];

      function tryMirror(index) {
        if (index >= mirrors.length) {
          document.open();
          document.write(`
            <!DOCTYPE html>
            <html>
              <head>
                <title>Launcher Error</title>
                <style>
                  html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    background: #000;
                    color: #fff;
                    font-family: Arial, sans-serif;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  }

                  p {
                    font-size: 16px;
                  }
                </style>
              </head>
              <body>
                <p>Oops, I guess it didn't load. Try again.</p>
              </body>
            </html>
          `);
          document.close();
          return;
        }

        fetch(mirrors[index], {
          cache: "no-store"
        })
          .then(response => {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }

            return response.text();
          })
          .then(html => {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(() => {
            tryMirror(index + 1);
          });
      }

      tryMirror(0);
    })();
  </script>
</body>
</html>
